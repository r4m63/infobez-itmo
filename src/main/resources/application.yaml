spring:
  application:
    name: infobez-itmo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/infobez}
    username: ${DB_USERNAME:infobez}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: infobez-itmo
    ttl: 15m

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
