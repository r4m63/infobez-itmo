name: Build and Security Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build backend
        run: ./mvnw $MAVEN_ARGS -DskipTests package

  sast-spotbugs:
    name: SAST. SpotBugs code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Analyze code with SpotBugs and Find Security Bugs
        run: ./mvnw $MAVEN_ARGS -DskipTests compile spotbugs:spotbugs spotbugs:check
      - name: Add SpotBugs results to job summary
        if: always()
        run: |
          if [ ! -f target/spotbugsXml.xml ]; then
            echo "SpotBugs report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          COUNT=$(grep -c '<BugInstance' target/spotbugsXml.xml || true)
          echo "### SpotBugs + Find Security Bugs" >> "$GITHUB_STEP_SUMMARY"
          echo "Найдено проблем (threshold Medium, effort Max): **${COUNT:-0}**" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spotbugs-report
          path: |
            target/spotbugsXml.xml
            target/site/spotbugs.html
          if-no-files-found: error

  sca-dependency-check:
    name: SCA. OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Scan dependencies with OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw $MAVEN_ARGS -DskipTests dependency-check:check
      - name: Add Dependency-Check results to job summary
        if: always()
        run: |
          echo "### OWASP Dependency-Check" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f target/dependency-check-report.json ]; then
            echo "Scan failed: JSON report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          r = json.load(open('target/dependency-check-report.json'))
          deps = r['dependencies']
          sev = collections.Counter(v['severity'].upper() for d in deps for v in d.get('vulnerabilities', []))
          print(f"Проверено зависимостей: **{len(deps)}**, уязвимостей: **{sum(sev.values())}** {dict(sev) if sev else ''}")
          PY
      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: error
