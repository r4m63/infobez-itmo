name: Сборка и проверки безопасности

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp

jobs:
  build-test:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получить код проекта
        uses: actions/checkout@v6
      - name: Установить JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Собрать проект и запустить тесты
        run: ./mvnw $MAVEN_ARGS verify
      - name: Сохранить отчёты тестов
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  sast-spotbugs:
    name: SAST — проверка кода SpotBugs
    runs-on: ubuntu-latest
    steps:
      - name: Получить код проекта
        uses: actions/checkout@v6
      - name: Установить JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Статический анализ байткода. Job падает при любой проблеме уровня Medium и выше.
      - name: Проверить код SpotBugs и Find Security Bugs
        run: ./mvnw $MAVEN_ARGS -DskipTests compile spotbugs:spotbugs spotbugs:check
      - name: Добавить результаты SpotBugs в сводку
        if: always()
        run: |
          COUNT=$(grep -c '<BugInstance' target/spotbugsXml.xml || true)
          echo "### SpotBugs + Find Security Bugs" >> "$GITHUB_STEP_SUMMARY"
          echo "Найдено проблем (threshold Medium, effort Max): **${COUNT:-0}**" >> "$GITHUB_STEP_SUMMARY"
      - name: Сохранить отчёты SpotBugs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spotbugs-report
          path: |
            target/spotbugsXml.xml
            target/site/spotbugs.html
          if-no-files-found: ignore

  sca-dependency-check:
    name: SCA — проверка зависимостей OWASP
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Получить код проекта
        uses: actions/checkout@v6
      - name: Установить JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Локальная копия базы NVD кэшируется между запусками.
      - name: Восстановить кэш базы NVD
        if: env.NVD_API_KEY != ''
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      # Job падает при CVSS >= 7 (failBuildOnCVSS в pom.xml).
      # NVD API с GitHub-раннеров без ключа не отвечает (rate limit), поэтому нужен секрет NVD_API_KEY:
      # бесплатно выдаётся на https://nvd.nist.gov/developers/request-an-api-key,
      # добавляется в Settings -> Secrets and variables -> Actions.
      - name: Проверить зависимости OWASP Dependency-Check
        if: env.NVD_API_KEY != ''
        run: ./mvnw $MAVEN_ARGS -DskipTests -Dnvd.api.key="$NVD_API_KEY" dependency-check:check
      - name: Добавить результаты Dependency-Check в сводку
        if: always() && env.NVD_API_KEY != ''
        run: |
          echo "### OWASP Dependency-Check" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          r = json.load(open('target/dependency-check-report.json'))
          deps = r['dependencies']
          sev = collections.Counter(v['severity'].upper() for d in deps for v in d.get('vulnerabilities', []))
          print(f"Проверено зависимостей: **{len(deps)}**, уязвимостей: **{sum(sev.values())}** {dict(sev) if sev else ''}")
          PY
      - name: Сообщить об отсутствии ключа NVD
        if: env.NVD_API_KEY == ''
        run: |
          echo "::warning::Секрет NVD_API_KEY не задан — шаг OWASP Dependency-Check пропущен. SCA выполняет Trivy."
          echo "### OWASP Dependency-Check" >> "$GITHUB_STEP_SUMMARY"
          echo "Пропущен: секрет NVD_API_KEY не задан." >> "$GITHUB_STEP_SUMMARY"
      - name: Сохранить отчёты Dependency-Check
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore

  sca-trivy:
    name: SCA — проверка зависимостей и секретов Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Получить код проекта
        uses: actions/checkout@v6
      # Второй SCA-сканер: не требует ключей, использует собственную базу уязвимостей.
      # Job падает при HIGH/CRITICAL уязвимостях в зависимостях, найденных секретах или мисконфигурациях.
      - name: Проверить зависимости, секреты и конфигурацию Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-report.txt
      - name: Показать отчёт Trivy и добавить его в сводку
        if: always()
        run: |
          cat trivy-report.txt
          echo "### Trivy" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Сохранить отчёт Trivy
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: trivy-report.txt
