services:
  postgres:
    image: postgres:18-alpine
    container_name: infobez-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infobez}
      POSTGRES_USER: ${POSTGRES_USER:-infobez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      # Наружу не публикуем: только localhost разработчика.
      - "127.0.0.1:5432:5432"
    volumes:
      # Для образов postgres:18+ том монтируется в /var/lib/postgresql (не в .../data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infobez} -d ${POSTGRES_DB:-infobez}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
