openapi: 3.0.3
info:
  title: Защищённый REST API — работа 1
  version: 1.0.0
  description: |
    Запустите приложение на localhost:8080. Сначала вызовите POST /auth/login,
    затем передайте полученный accessToken через Authorize (без слова Bearer).
servers:
  - url: http://localhost:8080
    description: Локальный сервер Spring Boot

paths:
  /auth/login:
    post:
      summary: Войти и получить JWT
      operationId: login
      tags: [Аутентификация]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: admin-password
      responses:
        '200':
          description: JWT выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Неверный логин или пароль
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/data:
    get:
      summary: Получить список постов
      operationId: getData
      tags: [Посты]
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          description: Необязательный поиск по заголовку
          required: false
          schema:
            type: string
            maxLength: 100
          example: Первый
      responses:
        '200':
          description: Список постов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
        '400':
          description: Слишком длинный параметр query
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Bearer-токен отсутствует или недействителен

  /api/posts:
    post:
      summary: Создать пост
      description: Автор берётся из JWT; поле author в запросе не требуется.
      operationId: createPost
      tags: [Посты]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
            example:
              title: Заголовок
              content: Текст поста
      responses:
        '201':
          description: Пост создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Bearer-токен отсутствует или недействителен

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    Token:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT; действует 15 минут
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          example: 900

    PostRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 4000

    Post:
      type: object
      required: [id, title, content, author, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: HTML-символы экранированы
        content:
          type: string
          description: HTML-символы экранированы
        author:
          type: string
        createdAt:
          type: string
          format: date-time

    DataResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        total:
          type: integer
          example: 2

    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
